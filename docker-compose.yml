version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jhojan
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: examen

  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
